name: wysearr

x-common: &common
  restart: unless-stopped
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment:
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    TZ: ${TZ:-Pacific/Honolulu}

services:
  gluetun:
    <<: *common
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:-Pacific/Honolulu}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:?VPN_SERVICE_PROVIDER must be set}
      VPN_TYPE: openvpn
      OPENVPN_USER: ${OPENVPN_USER:?OPENVPN_USER must be set}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:?OPENVPN_PASSWORD must be set}
      OPENVPN_PROTOCOL: ${OPENVPN_PROTOCOL:-udp}
      SERVER_REGIONS: ${VPN_SERVER_REGIONS:-CA Vancouver}
      PORT_FORWARD_ONLY: "on"
      VPN_PORT_FORWARDING: "on"
      VPN_PORT_FORWARDING_STATUS_FILE: /gluetun/forwarded_port
      IPV6: "off"
      LOG_LEVEL: warn
      HTTP_CONTROL_SERVER_ADDRESS: 127.0.0.1:8000
    volumes:
      - gluetun-data:/gluetun
      - ./docker/gluetun/auth/config.toml:/gluetun/auth/config.toml:ro
    ports:
      - "${WYSEARR_BIND_ADDRESS:-192.168.4.86}:${QBITTORRENT_PORT:-8080}:8080"
    networks:
      default:
        aliases:
          - qbittorrent

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:5.1.4@sha256:c9990949e968e99333f47f49da7d16e81ba6e1469c8c46807a65b984c9e8b6ff
    container_name: qbittorrent
    network_mode: service:gluetun
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Pacific/Honolulu}
      WEBUI_PORT: 8080
    volumes:
      - ./config/qbittorrent:/config
      - ${TORRENT_ROOT:-/home/wyseadmin/homelab/state/torrents}:/downloads
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9999/ >/dev/null && curl -fsS http://127.0.0.1:8080/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  qbittorrent-port-forward:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:5.1.4@sha256:c9990949e968e99333f47f49da7d16e81ba6e1469c8c46807a65b984c9e8b6ff
    container_name: qbittorrent-port-forward
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["/bin/sh", "/opt/wysearr/qbittorrent-port-forward.sh"]
    environment:
      QBITTORRENT_URL: http://127.0.0.1:8080
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-admin}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
      QBITTORRENT_VPN_INTERFACE: tun0
      GLUETUN_HEALTH_URL: http://127.0.0.1:9999/
      VPN_PORT_FORWARDING_STATUS_FILE: /gluetun/forwarded_port
      PORT_FORWARD_SYNC_INTERVAL_SECONDS: "15"
    volumes:
      - gluetun-data:/gluetun:ro
      - ./scripts/qbittorrent-port-forward.sh:/opt/wysearr/qbittorrent-port-forward.sh:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
      qbittorrent:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/wysearr/qbittorrent-port-forward.sh", "--check"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  abba:
    <<: *common
    build:
      context: .
      dockerfile: docker/abba/Dockerfile
    container_name: abba
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Pacific/Honolulu}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      ABB_HOSTNAME: ${ABBA_ABB_HOSTNAME:-audiobookbay.lu}
      PAGE_LIMIT: ${ABBA_PAGE_LIMIT:-1}
      PORT: "5078"
      ABBA_DB_PATH: /config/abba.db
      ABBA_SEARCH_CACHE_SECONDS: ${ABBA_SEARCH_CACHE_SECONDS:-300}
      ABBA_SEARCH_MIN_INTERVAL_SECONDS: ${ABBA_SEARCH_MIN_INTERVAL_SECONDS:-2}
      ABBA_RESULT_TTL_SECONDS: ${ABBA_RESULT_TTL_SECONDS:-86400}
      ABBA_HTTP_TIMEOUT_SECONDS: ${ABBA_HTTP_TIMEOUT_SECONDS:-15}
      ABBA_MAX_RESULTS: "10"
      DOWNLOAD_CLIENT: qbittorrent
      DL_SCHEME: http
      DL_HOST: qbittorrent
      DL_PORT: "8080"
      DL_USERNAME: ${QBITTORRENT_USERNAME:-admin}
      DL_PASSWORD: ${QBITTORRENT_PASSWORD}
      DL_CATEGORY: audiobooks
      SAVE_PATH_BASE: /downloads/audiobooks
      DL_VERIFY_TLS: "true"
    volumes:
      - ./config/abba:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    depends_on:
      qbittorrent:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5078/health', timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr@sha256:1295cff29d10b486c0d8324d1559a552140a5932bf8b3d87e398654414f63f92
    container_name: prowlarr
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "${WYSEARR_BIND_ADDRESS:-192.168.4.86}:${PROWLARR_PORT:-9696}:9696"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ping >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  lazylibrarian:
    <<: *common
    # LinuxServer image build 02af0464-ls331, published 2026-08-13.
    image: lscr.io/linuxserver/lazylibrarian@sha256:f2fd332fb4c5918571f8babd4d52fbcb9ca514be254ba101a47c275cd57eb33f
    container_name: lazylibrarian
    # LazyLibrarian's early config loader can echo downloader credentials before
    # its application-level redactor initializes. Persisted /config logs remain
    # available and redacted; disable Docker stdout retention for this service.
    logging:
      driver: none
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Pacific/Honolulu}
      UMASK: "077"
    volumes:
      # LazyLibrarian owns search/acquisition only. BookBot owns downloaded
      # payloads and the final library, so neither filesystem is mounted here.
      - ./config/lazylibrarian:/config
    ports:
      - "127.0.0.1:${LAZYLIBRARIAN_ADMIN_PORT:-5299}:5299"
    depends_on:
      qbittorrent:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5299/home >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  sabnzbd:
    <<: *common
    image: lscr.io/linuxserver/sabnzbd:version-5.0.4@sha256:4307a4ef4a1687c6f7dfa36fc745c1fc10b78db9916b64970b9ff682539dd03b
    container_name: sabnzbd
    volumes:
      - ./config/sabnzbd:/config
      - ${TORRENT_ROOT:-/home/wyseadmin/homelab/state/torrents}/incomplete/usenet:/downloads/incomplete/usenet
      - ${TORRENT_ROOT:-/home/wyseadmin/homelab/state/torrents}/usenet:/downloads/usenet
    # Evaluation administration is available only from the host (or an SSH
    # tunnel). Shelfarr uses the private Compose address http://sabnzbd:8080.
    ports:
      - "127.0.0.1:${SABNZBD_ADMIN_PORT:-8085}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  shelfarr:
    <<: *common
    image: ghcr.io/pedro-revez-silva/shelfarr:2026.08.09.1@sha256:5e331192a8a7b55e3bee055d28403f83fd9d4977f52b6dcb11c86adcdbb70083
    container_name: shelfarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Pacific/Honolulu}
      CHOWN_ON_START: ${SHELFARR_CHOWN_ON_START:-never}
      SOLID_QUEUE_IN_PUMA: "1"
    volumes:
      # Persist the complete tree: SQLite databases, encryption keys, queue
      # state, and Active Storage all live below /rails/storage.
      - ./config/shelfarr:/rails/storage
      # Limit filesystem authority to Shelfarr's ebook acquisition roots. Its
      # qBittorrent and SAB clients still address these as /downloads/shelfarr
      # and /downloads/usenet respectively.
      - ${TORRENT_ROOT:-/home/wyseadmin/homelab/state/torrents}/shelfarr:/downloads/shelfarr
      - ${TORRENT_ROOT:-/home/wyseadmin/homelab/state/torrents}/usenet:/downloads/usenet
      # Shelfarr is the exclusive finalizer for its own ebook lane.
      # Audiobooks are acquired by ABBA and finalized through the preserved
      # BookBot category pipeline.
      - ${MEDIA_ROOT:-/mnt/media}/ebooks/Books:/ebooks
      # Direct ebook downloads need a mode-0700 staging tree. The DAS is
      # CIFS and intentionally synthesizes broader modes, so keep staging on
      # local storage while Shelfarr remains the final library publisher.
      - ./state/shelfarr-staging/ebooks:/ebooks/.shelfarr-staging
      - ./scripts/shelfarr_bootstrap.rb:/opt/wysearr/shelfarr_bootstrap.rb:ro
      - ./scripts/shelfarr_exec.rb:/opt/wysearr/shelfarr_exec.rb:ro
    # Shelfarr is an internal Huey API dependency, not a family-facing UI.
    # Loopback publication exists only for initial operator configuration.
    ports:
      - "127.0.0.1:${SHELFARR_ADMIN_PORT:-5056}:80"
    depends_on:
      qbittorrent:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
      sabnzbd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/up"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr@sha256:373159ba768e23a3a1c497d9f2b936addf8fd5b1fdce7dd6a14080ac928bfda0
    container_name: sonarr
    volumes:
      - ./config/sonarr:/config
      - ${TORRENT_ROOT:-/home/wyseadmin/homelab/state/torrents}:/downloads
      - ${PHYSICAL_MEDIA_ROOT:-/home/wyseadmin/homelab/state/physical-media}:/downloads/physical-media
      - ${MEDIA_ROOT:-/mnt/media}:/media
    ports:
      - "${WYSEARR_BIND_ADDRESS:-192.168.4.86}:${SONARR_PORT:-8989}:8989"
    depends_on:
      qbittorrent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8989/ping >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr@sha256:a45b5ab0f850f39edb4cc9c95bbd967b52ddc3d4574a4dfb45561177db6c88f4
    container_name: radarr
    volumes:
      - ./config/radarr:/config
      - ${TORRENT_ROOT:-/home/wyseadmin/homelab/state/torrents}:/downloads
      - ${PHYSICAL_MEDIA_ROOT:-/home/wyseadmin/homelab/state/physical-media}:/downloads/physical-media
      - ${MEDIA_ROOT:-/mnt/media}:/media
    ports:
      - "${WYSEARR_BIND_ADDRESS:-192.168.4.86}:${RADARR_PORT:-7878}:7878"
    depends_on:
      qbittorrent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7878/ping >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  lidarr:
    <<: *common
    image: lscr.io/linuxserver/lidarr@sha256:bfec0ec2dc351fa5928379d785b08be395886f109393b9040ed7973bd1008060
    container_name: lidarr
    volumes:
      - ./config/lidarr:/config
      - ${TORRENT_ROOT:-/home/wyseadmin/homelab/state/torrents}:/downloads
      - ${MEDIA_ROOT:-/mnt/media}:/media
    ports:
      - "${WYSEARR_BIND_ADDRESS:-192.168.4.86}:${LIDARR_PORT:-8686}:8686"
    depends_on:
      qbittorrent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8686/ping >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr@sha256:e464484e7e6cff8ee189036c9ba96977ab054104ea18067ecf6171d0f3f3f8f2
    container_name: bazarr
    volumes:
      - ./config/bazarr:/config
      - ${MEDIA_ROOT:-/mnt/media}:/media
    ports:
      - "${WYSEARR_BIND_ADDRESS:-192.168.4.86}:${BAZARR_PORT:-6767}:6767"
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6767/api/system/ping >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  whisparr:
    <<: *common
    image: ghcr.io/hotio/whisparr@sha256:13f14e5cd86012f775cc07fe672cd279a295ef41605b8fc3ebfb47583bf50eac
    container_name: whisparr
    # This release's console target can retain a Prowlarr Torznab URL when an
    # upstream test fails, including query values missed by its redactor. Keep
    # the private application logs on /config, but do not retain Docker stdout.
    logging:
      driver: none
    volumes:
      - ./config/whisparr:/config
      - ${TORRENT_ROOT:-/home/wyseadmin/homelab/state/torrents}:/downloads
      - ${MEDIA_ROOT:-/mnt/media}:/media
    ports:
      - "${WYSEARR_BIND_ADDRESS:-192.168.4.86}:${WHISPARR_PORT:-6969}:6969"
    depends_on:
      qbittorrent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6969/ping >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  bookbot:
    <<: *common
    build:
      context: .
      dockerfile: docker/bookbot/Dockerfile
    container_name: bookbot
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Pacific/Honolulu}
      PYTHONUNBUFFERED: 1
      QBITTORRENT_URL: http://qbittorrent:8080
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-admin}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
      BOOKBOT_DB_PATH: /config/bookbot.db
      BOOKBOT_HEALTH_PATH: /config/bookbot-health.json
      MEDIA_ROOT: /media
      TORRENT_ROOT: /downloads
      HUEY_DB_PATH: /state/huey/huey.db
      POLL_SECONDS: ${BOOKBOT_POLL_SECONDS:-60}
      RETENTION_DAYS: ${TORRENT_RETENTION_DAYS:-14}
    volumes:
      - ./config/bookbot:/config
      - ./state/huey:/state/huey
      - ${TORRENT_ROOT:-/home/wyseadmin/homelab/state/torrents}:/downloads
      - ${MEDIA_ROOT:-/mnt/media}:/media
    depends_on:
      qbittorrent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/scripts/processing/healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  huey:
    <<: *common
    build:
      context: .
      dockerfile: docker/huey/Dockerfile
    container_name: huey
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      PYTHONUNBUFFERED: 1
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      PROWLARR_SEARCH_CONNECT_TIMEOUT_SECONDS: ${PROWLARR_SEARCH_CONNECT_TIMEOUT_SECONDS:-5}
      PROWLARR_SEARCH_READ_TIMEOUT_SECONDS: ${PROWLARR_SEARCH_READ_TIMEOUT_SECONDS:-90}
      PROWLARR_SEARCH_ATTEMPTS: ${PROWLARR_SEARCH_ATTEMPTS:-2}
      PROWLARR_SEARCH_RETRY_DELAY_SECONDS: ${PROWLARR_SEARCH_RETRY_DELAY_SECONDS:-1}
      SONARR_URL: http://sonarr:8989
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_URL: http://radarr:7878
      RADARR_API_KEY: ${RADARR_API_KEY}
      LIDARR_URL: http://lidarr:8686
      LIDARR_API_KEY: ${LIDARR_API_KEY}
      QBITTORRENT_URL: http://qbittorrent:8080
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-admin}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
      ABBA_ENABLED: ${ABBA_ENABLED:-false}
      ABBA_URL: ${ABBA_URL:-http://abba:5078}
      ABBA_TIMEOUT_SECONDS: ${ABBA_TIMEOUT_SECONDS:-30}
      ABBA_SEARCH_LIMIT: ${ABBA_SEARCH_LIMIT:-10}
      HUEY_ABBA_MINIMUM_CONFIDENCE: ${HUEY_ABBA_MINIMUM_CONFIDENCE:-0.82}
      HUEY_ABBA_RUNNER_UP_GAP: ${HUEY_ABBA_RUNNER_UP_GAP:-0.08}
      EBOOK_ACQUISITION_BACKENDS: ${EBOOK_ACQUISITION_BACKENDS:-}
      EBOOK_ACQUISITION_OWNER: ${EBOOK_ACQUISITION_OWNER:-}
      LAZYLIBRARIAN_ENABLED: ${LAZYLIBRARIAN_ENABLED:-false}
      LAZYLIBRARIAN_URL: ${LAZYLIBRARIAN_URL:-http://lazylibrarian:5299}
      LAZYLIBRARIAN_API_KEY: ${LAZYLIBRARIAN_API_KEY:-}
      LAZYLIBRARIAN_TIMEOUT_SECONDS: ${LAZYLIBRARIAN_TIMEOUT_SECONDS:-30}
      LAZYLIBRARIAN_SEARCH_LIMIT: ${LAZYLIBRARIAN_SEARCH_LIMIT:-10}
      LAZYLIBRARIAN_METADATA_SOURCE: ${LAZYLIBRARIAN_METADATA_SOURCE:-OpenLibrary}
      HUEY_LAZYLIBRARIAN_MINIMUM_CONFIDENCE: ${HUEY_LAZYLIBRARIAN_MINIMUM_CONFIDENCE:-0.80}
      HUEY_LAZYLIBRARIAN_RUNNER_UP_GAP: ${HUEY_LAZYLIBRARIAN_RUNNER_UP_GAP:-0.05}
      SHELFARR_ENABLED: ${SHELFARR_ENABLED:-false}
      SHELFARR_URL: ${SHELFARR_URL:-http://shelfarr}
      SHELFARR_API_TOKEN: ${SHELFARR_API_TOKEN:-}
      SHELFARR_TIMEOUT_SECONDS: ${SHELFARR_TIMEOUT_SECONDS:-20}
      SHELFARR_SEARCH_LIMIT: ${SHELFARR_SEARCH_LIMIT:-10}
      SHELFARR_LANGUAGE: ${SHELFARR_LANGUAGE:-en}
      HUEY_SHELFARR_MINIMUM_CONFIDENCE: ${HUEY_SHELFARR_MINIMUM_CONFIDENCE:-0.80}
      HUEY_SHELFARR_RUNNER_UP_GAP: ${HUEY_SHELFARR_RUNNER_UP_GAP:-0.05}
      HUEY_SELECTION_TTL_SECONDS: ${HUEY_SELECTION_TTL_SECONDS:-900}
      PHYSICAL_MEDIA_ENABLED: ${PHYSICAL_MEDIA_ENABLED:-false}
      PHYSICAL_MEDIA_INTAKE_PATH: /physical-media/incoming
      PHYSICAL_MEDIA_RADARR_PATH: /downloads/physical-media/incoming
      PHYSICAL_MEDIA_SONARR_PATH: /downloads/physical-media/incoming
      PHYSICAL_MEDIA_DAS_PATH: /media
      PHYSICAL_MEDIA_MIN_SIZE_BYTES: ${PHYSICAL_MEDIA_MIN_SIZE_BYTES:-52428800}
      PHYSICAL_MEDIA_VERIFY_FINAL_HASH: ${PHYSICAL_MEDIA_VERIFY_FINAL_HASH:-false}
    volumes:
      - ./state/huey:/state
      - ${PHYSICAL_MEDIA_ROOT:-/home/wyseadmin/homelab/state/physical-media}:/physical-media
      - ${MEDIA_ROOT:-/mnt/media}:/media:ro
    depends_on:
      qbittorrent:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
      lidarr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/scripts/huey/healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  gluetun-data:
