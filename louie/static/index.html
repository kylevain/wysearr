<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Louie status</title>
<style>
:root{font-family:ui-sans-serif,system-ui,sans-serif;color:#17212b;background:#eef1ed;--ink:#17212b;--muted:#66716e;--line:#d3dad4;--paper:#fbfcf8;--accent:#bc4b35;--green:#3d765b}
*{box-sizing:border-box}body{margin:0}header{padding:28px 4vw 22px;background:#17212b;color:#f5f7f1;display:flex;justify-content:space-between;align-items:end;gap:20px}h1{margin:0;font:700 38px Georgia,serif;letter-spacing:0}header p{margin:6px 0 0;color:#b9c7c0}main{padding:24px 4vw;overflow-x:auto}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}select{border:1px solid var(--line);background:var(--paper);padding:9px 12px;color:var(--ink);font-size:14px}.board{display:grid;grid-template-columns:repeat(6,minmax(230px,1fr));gap:12px;min-width:1450px}.column{background:#e1e7e1;border-top:4px solid var(--green);min-height:190px}.column[data-status=failed],.column[data-status=ambiguous],.column[data-status=unparsed]{border-color:var(--accent)}.column h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;margin:0;padding:13px 13px 7px}.count{color:var(--muted);font-weight:400}.items{padding:0 9px 12px}.item{background:var(--paper);border:1px solid var(--line);padding:11px;margin-top:8px;box-shadow:0 2px 0 rgba(23,33,43,.05)}.title{font-weight:700;line-height:1.25}.meta{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.4}.bar{height:5px;background:#d8dfd9;margin-top:9px}.bar i{display:block;height:100%;background:var(--green)}.empty{font-size:13px;color:var(--muted);padding:8px 4px}.error{color:var(--accent)}
</style></head>
<body><header><div><h1>Louie</h1><p>One view of every acquisition in motion.</p></div><div id="checked">checking...</div></header><main><div class="toolbar"><select id="media"><option value="">All media</option><option>movies-tv</option><option>ebooks</option><option>audiobooks</option><option>music</option></select><select id="origin"><option value="">All origins</option><option value="discord">Discord</option><option value="physical_disc">Physical disc</option><option value="manual">Manual</option></select></div><div class="board" id="board"></div></main>
<script>
const statuses=['submitted','searching','downloading','importing','stalled','seeding','completed','failed','ambiguous','unparsed','manual_review'];
const labels={submitted:'Submitted',searching:'Searching',downloading:'Downloading',importing:'Importing',stalled:'Stalled',seeding:'Seeding',completed:'Completed',failed:'Failed',ambiguous:'Needs clarification',unparsed:'Unparsed',manual_review:'Manual review'};
async function refresh(){const q=new URLSearchParams();if(media.value)q.set('media_type',media.value);if(origin.value)q.set('origin',origin.value);const [items,health]=await Promise.all([fetch('/api/requests?'+q).then(r=>r.json()),fetch('/api/health').then(r=>r.json())]);board.innerHTML='';for(const status of statuses){const list=items.filter(x=>x.status===status);const col=document.createElement('section');col.className='column';col.dataset.status=status;col.innerHTML=`<h2>${labels[status]} <span class="count">${list.length}</span></h2><div class="items">${list.length?list.map(card).join(''):'<div class="empty">Nothing here</div>'}</div>`;board.append(col)}checked.textContent='checked '+new Date(health.last_checked).toLocaleTimeString()}
function card(x){const pct=Number.isFinite(x.progress_pct)?Math.max(0,Math.min(100,x.progress_pct)):null;return `<article class="item"><div class="title">${esc(x.title||'Untitled')}</div><div class="meta">#${esc(x.request_id)} · ${esc(x.media_type||'unknown')} · ${esc(x.origin)}${x.service?' · '+esc(x.service):''}${x.requested_by?' · '+esc(x.requested_by):''}</div>${pct===null?'':`<div class="bar"><i style="width:${pct}%"></i></div><div class="meta">${pct.toFixed(1)}%</div>`}${x.error?`<div class="meta error">${esc(x.error)}</div>`:''}</article>`}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}media.onchange=origin.onchange=refresh;refresh();setInterval(refresh,30000);
</script></body></html>
